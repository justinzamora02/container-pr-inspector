name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: steps.release.outputs.releases_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}
      - if: steps.release.outputs.releases_created == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - if: steps.release.outputs.releases_created == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - if: steps.release.outputs.releases_created == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.release.outputs.releases_created == 'true'
        run: pnpm verify
      - if: steps.release.outputs.releases_created == 'true'
        name: Add the Action bundle to the release ref
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force dist/index.js dist/package.json
          git commit -m "chore: bundle action for ${{ steps.release.outputs.tag_name }}"
          git tag --force "${{ steps.release.outputs.tag_name }}"
          git tag --force v1
          git push --force origin \
            "refs/tags/${{ steps.release.outputs.tag_name }}" \
            refs/tags/v1
      - if: steps.release.outputs.releases_created == 'true'
        run: pnpm publish --no-git-checks
