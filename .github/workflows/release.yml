name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release metadata
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node --print "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package version ${package_version}; expected ${expected_tag}."
            exit 1
          fi

          if [[ "$IS_PRERELEASE" == "true" && "$package_version" != *-* ]]; then
            echo "::error::A GitHub prerelease must use a prerelease package version."
            exit 1
          fi

          if [[ "$IS_PRERELEASE" != "true" && "$package_version" == *-* ]]; then
            echo "::error::A stable GitHub release cannot use a prerelease package version."
            exit 1
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm verify
      - name: Add the Action bundle to the release ref
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force dist/index.js dist/package.json
          git commit -m "chore: bundle action for ${RELEASE_TAG}"
          git tag --force "$RELEASE_TAG"

          tags=("refs/tags/${RELEASE_TAG}")
          if [[ "$IS_PRERELEASE" != "true" ]]; then
            major_tag="${RELEASE_TAG%%.*}"
            git tag --force "$major_tag"
            tags+=("refs/tags/${major_tag}")
          fi

          git push --atomic --force origin "${tags[@]}"
      - name: Publish the npm package
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --tag "$NPM_DIST_TAG"
